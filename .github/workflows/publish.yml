name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.3.52)'
        required: true

permissions:
  contents: write
  actions: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (tag: $TAG)"

      - name: Extract changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract section between ## [$VERSION] and the next ## [
          CHANGELOG=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d' | sed '/^$/d')
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See [CHANGELOG.md](https://github.com/atilladeniz/Kubeli/blob/main/CHANGELOG.md) for details."
          fi
          # Write to file to preserve newlines
          echo "$CHANGELOG" > /tmp/changelog.md
          echo "Found changelog for v$VERSION"

      - name: Get previous tag
        id: prev-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Build release body
        id: body
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.prev-tag.outputs.prev_tag }}
        run: |
          CHANGELOG=$(cat /tmp/changelog.md)

          BODY="## What's Changed

          $CHANGELOG"

          if [ -n "$PREV_TAG" ]; then
            BODY="$BODY

          **Full Changelog**: https://github.com/atilladeniz/Kubeli/compare/$PREV_TAG...v$VERSION"
          fi

          echo "$BODY" > /tmp/release-body.md

      - name: Create draft release
        id: create-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/release-body.md', 'utf8');

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG,
              name: `Kubeli v${process.env.VERSION}`,
              body: body,
              draft: true,
              prerelease: false
            });
            console.log(`Created draft release ${data.id}: ${data.html_url}`);
            return data.id;

  build:
    name: Build (${{ matrix.label }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # Every entry sets appimage_suffix, including the ones that do not
        # build an AppImage. The steps below branch on it, and GitHub only
        # compares operands directly when their types match — an undefined
        # property would be Null and get coerced to a number instead.
        include:
          - platform: macos-15
            label: macOS-aarch64
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
            appimage_suffix: ''
          - platform: macos-15
            label: macOS-x86_64
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
            appimage_suffix: ''
          - platform: windows-latest
            label: Windows-x64
            args: ''
            rust_target: ''
            appimage_suffix: ''
          # Two Linux builds on purpose. The AppImage bundles the build host's
          # WebKitGTK, so one build cannot serve every target:
          #   22.04 -> WebKit 2.50, glibc 2.35 — works back to Ubuntu 22.04 /
          #            Debian 12, but its WebKit aborts with EGL_BAD_PARAMETER
          #            against Mesa >= 25 (Fedora 43, Arch). See #429.
          #   24.04 -> WebKit 2.52, glibc 2.39 — fixes that crash, but will not
          #            start on distros older than Ubuntu 24.04 / Debian 13.
          # 22.04 stays the updater target, so existing installs keep the
          # widest-compatibility build unless the user picks the other one.
          - platform: ubuntu-22.04
            label: Linux-x64
            args: ''
            rust_target: ''
            appimage_suffix: ''
          - platform: ubuntu-24.04
            label: Linux-x64-modern
            # Only the AppImage: deb/rpm link against the system WebKit, so the
            # 22.04 job's packages already work on new distros. Building them
            # twice would collide on identical filenames at upload.
            args: '--bundles appimage'
            rust_target: ''
            appimage_suffix: '-modern'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          echo "Bundling WebKitGTK: $(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-0)"
          echo "Against glibc: $(dpkg-query -W -f='${Version}' libc6)"

      - name: Install dependencies
        run: npm ci

      - name: Write Apple API key to file
        id: apple-key
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_CONTENT" > ~/private_keys/AuthKey_"$APPLE_API_KEY".p8
          echo "path=$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> $GITHUB_OUTPUT

      # Two build steps, split by an `if:` rather than by a conditional input.
      # The modern build must NOT receive releaseId: tauri-action would upload
      # its AppImage under the same name as the 22.04 one and overwrite it on
      # the release. A `x && '' || y` expression cannot express that — '' is
      # falsy, so it falls through to y and sets releaseId anyway.
      - name: Build Tauri app
        if: matrix.appimage_suffix != '-modern'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing (macOS only — ignored on other platforms)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ steps.apple-key.outputs.path }}
          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseDraft: true
          retryAttempts: 3
          args: ${{ matrix.args }}

      - name: Build modern Linux AppImage
        if: matrix.appimage_suffix == '-modern'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # No releaseId and no tagName: both make tauri-action upload. This
          # build is renamed and uploaded by the next step instead.
          args: ${{ matrix.args }}

      # Renames to Kubeli_<version>_amd64-modern.AppImage and uploads it (plus
      # its updater signature), which the build step above deliberately skipped.
      - name: Upload modern Linux AppImage
        if: matrix.appimage_suffix == '-modern'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          SUFFIX: ${{ matrix.appimage_suffix }}
        run: |
          set -euo pipefail
          bundle_dir=src-tauri/target/release/bundle/appimage
          shopt -s nullglob
          # *.AppImage only. Bundling also writes the updater package
          # <name>.AppImage.tar.gz, which this glob does not match and which
          # is deliberately not published: latest.json points at the 22.04
          # build, so an updater package for this one would never be fetched.
          images=("$bundle_dir"/*.AppImage)
          if [ ${#images[@]} -eq 0 ]; then
            echo "No AppImage produced in $bundle_dir" >&2
            exit 1
          fi
          for image in "${images[@]}"; do
            renamed="${image%.AppImage}${SUFFIX}.AppImage"
            # createUpdaterArtifacts is on and signing covers AppImage, so a
            # missing .sig means signing broke, not that it was skipped.
            # Publishing the binary without it would ship an unverifiable
            # artifact, so stop instead.
            if [ ! -f "$image.sig" ]; then
              echo "No updater signature next to $(basename "$image")" >&2
              exit 1
            fi
            mv "$image" "$renamed"
            mv "$image.sig" "$renamed.sig"
            gh release upload "$RELEASE_TAG" "$renamed" "$renamed.sig" --clobber
            echo "Uploaded $(basename "$renamed") and its signature"
          done

  sign-windows:
    name: Sign Windows Installers
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download unsigned Windows artifacts from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          mkdir -p unsigned
          gh release download "$RELEASE_TAG" --dir unsigned --pattern "*.exe" --pattern "*.msi"
          echo "Downloaded unsigned artifacts:"
          ls -la unsigned/

      - name: Prepare artifacts for signing
        run: |
          # Flatten to root level — SignPath artifact config expects files at ZIP root
          mkdir -p to-sign
          cp unsigned/Kubeli_*_x64-setup.exe to-sign/
          cp unsigned/Kubeli_*_x64_en-US.msi to-sign/
          echo "Prepared artifacts for signing:"
          ls -la to-sign/

      - name: Upload unsigned artifacts for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-to-sign
          path: to-sign/

      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'Kubeli'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: './signed'

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-signed
          path: signed/

  finalize:
    name: Finalize Release
    needs: [create-release, build, sign-windows]
    runs-on: ubuntu-latest
    environment: production
    # Job level, not step level: a step's own `if:` is evaluated before its
    # `env:` block is applied, so a secret declared there is an empty string
    # at that point and the guard would skip the step it guards.
    env:
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Set version
        id: version
        env:
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" --dir artifacts
          echo "Downloaded artifacts:"
          ls -la artifacts/

      - name: Download signed Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-signed
          path: signed/
        continue-on-error: true

      - name: Upload signed installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -d "signed" ] && ls signed/*.exe signed/*.msi 2>/dev/null | head -1 > /dev/null; then
            echo "Uploading signed Windows installers to release..."
            for f in signed/Kubeli_*_x64-setup.exe signed/Kubeli_*_x64_en-US.msi; do
              if [ -f "$f" ]; then
                BASENAME=$(basename "$f")
                echo "Replacing $BASENAME with signed version..."
                gh release upload "$RELEASE_TAG" "$f" --clobber
              fi
            done
            echo "Signed Windows installers uploaded to release"
          else
            echo "No signed artifacts found, keeping unsigned versions"
          fi

      - name: Build FTP latest.json
        env:
          DEPLOY_API_URL: ${{ secrets.DEPLOY_API_URL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Read signatures
          WIN_SIG=""
          LINUX_SIG=""

          # Windows
          for f in artifacts/*x64-setup.exe.sig artifacts/*x64_setup.exe.sig; do
            if [ -f "$f" ]; then
              WIN_SIG=$(cat "$f")
              echo "Found Windows signature: $f"
              break
            fi
          done

          # Linux — must be the 22.04 build, never the "-modern" one: it has the
          # lower glibc floor, so it is the only AppImage safe to push to every
          # existing install through the updater's single linux-x86_64 slot.
          # Selection rule lives in scripts/select-linux-artifacts.js so it is
          # covered by tests instead of only by a glob here.
          LINUX_SIG_FILE=$(node -e '
            const { selectUpdaterSignature } = require("./scripts/select-linux-artifacts");
            const fs = require("fs");
            process.stdout.write(selectUpdaterSignature(fs.readdirSync("artifacts")) ?? "");
          ')
          if [ -n "$LINUX_SIG_FILE" ]; then
            LINUX_SIG=$(cat "artifacts/$LINUX_SIG_FILE")
            echo "Found Linux signature: $LINUX_SIG_FILE"
          fi

          # Find artifact filenames for FTP URLs
          WIN_EXE=$(ls artifacts/*x64-setup.exe 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "")
          WIN_EXE=${WIN_EXE:-$(ls artifacts/*x64_setup.exe 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "")}
          LINUX_APPIMAGE=$(node -e '
            const { selectUpdaterAppImage } = require("./scripts/select-linux-artifacts");
            const fs = require("fs");
            process.stdout.write(selectUpdaterAppImage(fs.readdirSync("artifacts")) ?? "");
          ')

          # Build FTP latest.json
          PLATFORMS=""

          # One bundle per slot. Sharing one across both shipped arm64
          # binaries to Intel machines (#433).
          for SLOT in darwin-aarch64 darwin-x86_64; do
            MAC_TAR=$(SLOT="$SLOT" node -e '
              const { selectMacUpdateForSlot } = require("./scripts/select-linux-artifacts");
              const fs = require("fs");
              const found = selectMacUpdateForSlot(fs.readdirSync("artifacts"), process.env.SLOT);
              process.stdout.write(found?.bundle ?? "");
            ')
            if [ -z "$MAC_TAR" ]; then
              echo "No complete macOS bundle for $SLOT, skipping that slot"
              continue
            fi

            MAC_SIG=$(cat "artifacts/$MAC_TAR.sig")
            echo "Found macOS bundle for $SLOT: $MAC_TAR"
            if [ -n "$PLATFORMS" ]; then PLATFORMS="$PLATFORMS, "; fi
            PLATFORMS="$PLATFORMS\"$SLOT\": { \"signature\": \"$MAC_SIG\", \"url\": \"https://$DEPLOY_API_URL/$MAC_TAR\" }"
          done

          if [ -n "$WIN_SIG" ] && [ -n "$WIN_EXE" ]; then
            if [ -n "$PLATFORMS" ]; then PLATFORMS="$PLATFORMS, "; fi
            PLATFORMS="$PLATFORMS\"windows-x86_64\": { \"signature\": \"$WIN_SIG\", \"url\": \"https://$DEPLOY_API_URL/$WIN_EXE\" }"
          fi

          if [ -n "$LINUX_SIG" ] && [ -n "$LINUX_APPIMAGE" ]; then
            if [ -n "$PLATFORMS" ]; then PLATFORMS="$PLATFORMS, "; fi
            PLATFORMS="$PLATFORMS\"linux-x86_64\": { \"signature\": \"$LINUX_SIG\", \"url\": \"https://$DEPLOY_API_URL/$LINUX_APPIMAGE\" }"
          fi

          echo "{ \"version\": \"$VERSION\", \"notes\": \"Kubeli v$VERSION\", \"pub_date\": \"$DATE\", \"platforms\": { $PLATFORMS } }" > artifacts/ftp-latest.json

          echo "FTP latest.json:"
          cat artifacts/ftp-latest.json | python3 -m json.tool

      - name: Upload latest.json to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp artifacts/ftp-latest.json artifacts/latest.json
          gh release upload "$RELEASE_TAG" artifacts/latest.json --clobber
          echo "Uploaded latest.json to GitHub Release $RELEASE_TAG"

      - name: Generate SBOMs
        run: |
          # npm SBOM
          npm ci
          npx @cyclonedx/cyclonedx-npm --spec-version 1.5 --omit dev --output-format JSON --output-file sbom-npm.json --validate
          echo "Generated npm SBOM"

          # Rust SBOM
          rustup default stable
          cargo install cargo-cyclonedx@0.5.7 --locked || true
          cd src-tauri
          cargo cyclonedx --format json --spec-version 1.5 --no-build-deps --override-filename sbom-rust
          mv sbom-rust.json ../sbom-rust.json
          cd ..
          echo "Generated Rust SBOM"

      - name: Upload SBOMs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" sbom-npm.json sbom-rust.json --clobber
          echo "Uploaded SBOMs to GitHub Release $RELEASE_TAG"

      - name: Deploy to FTP (update server)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_API_FTP_PATH: ${{ secrets.DEPLOY_API_FTP_PATH }}
          DEPLOY_API_URL: ${{ secrets.DEPLOY_API_URL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Upload macOS update artifacts
          for f in artifacts/*.app.tar.gz artifacts/*.app.tar.gz.sig; do
            if [ -f "$f" ]; then
              BASENAME=$(basename "$f")
              echo "Uploading $BASENAME to update server..."
              curl -s -T "$f" --user "$FTP_USER:$FTP_PASSWORD" \
                "ftp://$FTP_HOST$DEPLOY_API_FTP_PATH/$BASENAME" --ftp-create-dirs
            fi
          done

          # Upload Windows update artifacts
          for f in artifacts/*x64-setup.exe artifacts/*x64-setup.exe.sig artifacts/*x64_setup.exe artifacts/*x64_setup.exe.sig; do
            if [ -f "$f" ]; then
              BASENAME=$(basename "$f")
              echo "Uploading $BASENAME to update server..."
              curl -s -T "$f" --user "$FTP_USER:$FTP_PASSWORD" \
                "ftp://$FTP_HOST$DEPLOY_API_FTP_PATH/$BASENAME" --ftp-create-dirs
            fi
          done

          # Upload Linux update artifacts
          for f in artifacts/*.AppImage artifacts/*.AppImage.sig; do
            if [ -f "$f" ]; then
              BASENAME=$(basename "$f")
              echo "Uploading $BASENAME to update server..."
              curl -s -T "$f" --user "$FTP_USER:$FTP_PASSWORD" \
                "ftp://$FTP_HOST$DEPLOY_API_FTP_PATH/$BASENAME" --ftp-create-dirs
            fi
          done

          # Upload FTP latest.json
          echo "Uploading latest.json..."
          curl -s -T "artifacts/ftp-latest.json" --user "$FTP_USER:$FTP_PASSWORD" \
            "ftp://$FTP_HOST$DEPLOY_API_FTP_PATH/latest.json" --ftp-create-dirs

          echo "Update server deployment complete: https://$DEPLOY_API_URL/latest.json"

      - name: Deploy download artifacts to FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_LANDING_FTP_PATH: ${{ secrets.DEPLOY_LANDING_FTP_PATH }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # macOS DMG
          DMG=$(ls artifacts/*.dmg 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            BASENAME=$(basename "$DMG")
            echo "Uploading $BASENAME (versioned + latest)..."
            curl -s -T "$DMG" --user "$FTP_USER:$FTP_PASSWORD" \
              "ftp://$FTP_HOST$DEPLOY_LANDING_FTP_PATH/$BASENAME" --ftp-create-dirs
            curl -s -T "$DMG" --user "$FTP_USER:$FTP_PASSWORD" \
              "ftp://$FTP_HOST$DEPLOY_LANDING_FTP_PATH/Kubeli_latest.dmg" --ftp-create-dirs
          fi

          # Windows EXE — prefer signed version for direct downloads
          EXE=$(ls signed/Kubeli_*_x64-setup.exe 2>/dev/null | head -1)
          EXE=${EXE:-$(ls artifacts/*x64-setup.exe 2>/dev/null | head -1)}
          EXE=${EXE:-$(ls artifacts/*x64_setup.exe 2>/dev/null | head -1)}
          if [ -n "$EXE" ]; then
            BASENAME=$(basename "$EXE")
            echo "Uploading $BASENAME (versioned + latest)..."
            curl -s -T "$EXE" --user "$FTP_USER:$FTP_PASSWORD" \
              "ftp://$FTP_HOST$DEPLOY_LANDING_FTP_PATH/$BASENAME" --ftp-create-dirs
            curl -s -T "$EXE" --user "$FTP_USER:$FTP_PASSWORD" \
              "ftp://$FTP_HOST$DEPLOY_LANDING_FTP_PATH/Kubeli_latest_x64-setup.exe" --ftp-create-dirs
          fi

          # Linux AppImages — both variants, each with its own "latest" alias.
          # Kubeli_latest_amd64.AppImage stays the 22.04 build so existing
          # download links keep serving the widest-compatibility one.
          for APPIMAGE in $(ls artifacts/*.AppImage 2>/dev/null | grep -v '.sig'); do
            BASENAME=$(basename "$APPIMAGE")
            ALIAS=$(BASENAME="$BASENAME" node -e '
              const { landingAliasFor } = require("./scripts/select-linux-artifacts");
              process.stdout.write(landingAliasFor(process.env.BASENAME));
            ')
            echo "Uploading $BASENAME (versioned + $ALIAS)..."
            curl -s -T "$APPIMAGE" --user "$FTP_USER:$FTP_PASSWORD" \
              "ftp://$FTP_HOST$DEPLOY_LANDING_FTP_PATH/$BASENAME" --ftp-create-dirs
            curl -s -T "$APPIMAGE" --user "$FTP_USER:$FTP_PASSWORD" \
              "ftp://$FTP_HOST$DEPLOY_LANDING_FTP_PATH/$ALIAS" --ftp-create-dirs
          done

          echo "Landing page deployment complete"

      # deb/rpm cannot use the Tauri updater, so an apt/dnf repository is the
      # only way those installs receive updates at all (#348).
      - name: Build signed APT and RPM repositories
        if: ${{ env.GPG_SIGNING_KEY != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c rpm gnupg

          printf '%s' "$GPG_SIGNING_KEY" | gpg --batch --quiet --import
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          if [ -z "$GPG_KEY_ID" ]; then
            echo "Signing key did not import" >&2
            exit 1
          fi
          echo "::add-mask::$GPG_KEY_ID"
          export GPG_KEY_ID

          ./scripts/build-linux-repos.sh linux-repos

      - name: Deploy repositories to FTP
        if: ${{ env.GPG_SIGNING_KEY != '' }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_LANDING_FTP_PATH: ${{ secrets.DEPLOY_LANDING_FTP_PATH }}
        run: |
          upload() {
            curl -sf -T "$1" --user "$FTP_USER:$FTP_PASSWORD" \
              "ftp://$FTP_HOST$DEPLOY_LANDING_FTP_PATH/$1" --ftp-create-dirs
          }

          cd linux-repos
          all=$(mktemp)
          # .packages/ is the download cache the build works from, not part of
          # either repository.
          find . -type f -not -path './.packages/*' | sed 's|^\./||' | sort > "$all"

          # Three passes, because a client refreshing mid-deploy must never
          # reach a signed index that references a file not uploaded yet.
          # Ordering within a pass is irrelevant; ordering between them is not,
          # so the signature files are matched by name rather than left to sort
          # order -- InRelease sorts before Packages, which is the wrong way
          # round and would hand clients a hash mismatch.
          is_signed_index='^(apt/dists/stable/(InRelease|Release|Release\.gpg)|rpm/repodata/repomd\.xml(\.asc)?)$'

          # 1. Packages and keys.
          grep -vE '^(apt/dists|rpm/repodata)/' "$all" | while read -r f; do upload "$f"; done
          # 2. Index payloads the signatures will vouch for.
          grep -E '^(apt/dists|rpm/repodata)/' "$all" | grep -vE "$is_signed_index" \
            | while read -r f; do upload "$f"; done
          # 3. The signed indexes themselves, last.
          grep -E "$is_signed_index" "$all" | while read -r f; do upload "$f"; done

          echo "Repository deployment complete"

      - name: Build Astro landing page
        run: |
          npm install -g bun
          cd web
          bun install
          bun run build
          echo "Landing page built successfully"

      # Incremental sync (same as ci.yml): hash-diff against the server-side
      # .ftp-deploy-sync-state.json, upload only changed/new, delete only files
      # this action previously uploaded. The release installers uploaded above
      # to the same path are not in the state file, so they stay untouched.
      - name: Deploy landing page to FTP (incremental)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: web/dist/
          server-dir: ${{ secrets.DEPLOY_LANDING_FTP_PATH }}/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
          echo "Release $RELEASE_TAG published!"
